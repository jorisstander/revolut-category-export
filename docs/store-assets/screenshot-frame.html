<!doctype html>
<meta charset="utf-8">
<title>Store screenshot frame — 1280×800</title>
<!--
  A capture target, not a design.

  The Chrome Web Store wants 1280×800 or 640×400, and `docs/screenshot.png` is
  640×940 — the popup at its own portrait aspect, right for the README and wrong
  for a listing. This centres it on a canvas of the correct size so the shot can
  be taken rather than composited by hand.

  Open it, capture the page at exactly 1280×800, save as `store-1280x800.png`.

  The image is inlined rather than linked. A relative `src` breaks whenever this
  is opened somewhere that rewrites the document — a preview pane serving it as a
  data: URL, an editor preview, a pasted copy — and it fails by rendering alt
  text, which looks enough like a page to screenshot by accident. Inlined, it
  cannot. Regenerate after changing the screenshot:

    node -e 'const{readFileSync,writeFileSync}=require("fs");const h=readFileSync("docs/store-assets/screenshot-frame.html","utf8");writeFileSync("docs/store-assets/screenshot-frame.html",h.replace(/data:image/png;base64,[A-Za-z0-9+/=]+/,"data:image/png;base64,"+readFileSync("docs/screenshot.png").toString("base64")))'

  Deliberately plain: no fonts, no gradients, no external resources of any kind
  (this repository allows no host but app.revolut.com, and a listing image should
  not be the exception). Whoever owns the popup design should feel free to replace
  it — on a store listing the presentation IS the product, and this exists only so
  the aspect ratio stops being a blocker.
-->
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 800px;
    display: grid;
    place-items: center;
    background: #f4f4f2;
    overflow: hidden;
  }
  img {
    height: 700px;                      /* 640×940 scaled to fit with margin */
    width: auto;
    display: block;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgb(0 0 0 / 0.14);
  }
</style>
